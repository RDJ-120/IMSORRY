<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0309">
  <title>اسفة 💗</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --deep: #12010a;
      --wine: #2a0511;
      --crimson: #7a0f26;
      --rose: #ff3d6e;
      --pink: #ff5fa6;
      --pink-soft: #ffc2da;
      --text: #ffe9f0;
      --box-width: min(90vw, 440px);

      /* heart shape used for the background pattern and the falling hearts */
      --heart-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Cairo", system-ui, sans-serif;
      color: var(--text);
      background-color: var(--deep);
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Background: deep red glow + faint tiled hearts ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(90% 55% at 50% 0%, rgba(255, 61, 110, 0.38) 0%, transparent 70%),
        radial-gradient(80% 50% at 50% 100%, rgba(185, 20, 55, 0.45) 0%, transparent 70%),
        linear-gradient(180deg, #3a0714 0%, var(--wine) 45%, var(--deep) 100%);
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='%23ff466e' fill-opacity='0.14'><path transform='translate(6 6) scale(1)' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/><path transform='translate(38 38) scale(0.8)' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></g></svg>");
      background-size: 64px 64px;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 90% at 50% 50%, transparent 40%, rgba(10, 0, 5, 0.75) 100%);
    }

    /* ---------- Falling hearts ---------- */
    .rain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .drop {
      position: absolute;
      top: -40px;
      background-color: var(--c, var(--rose));
      -webkit-mask-image: var(--heart-mask);
      mask-image: var(--heart-mask);
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      opacity: 0;
      animation: fall var(--dur) linear forwards;
      will-change: transform, opacity;
    }

    @keyframes fall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      8%   { opacity: var(--o); }
      85%  { opacity: var(--o); }
      100% { transform: translate3d(var(--drift), calc(100dvh + 80px), 0) rotate(var(--spin)); opacity: 0; }
    }

    /* ---------- Pages ---------- */
    .page {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: calc(env(safe-area-inset-top, 0px) + 22px) 0 calc(env(safe-area-inset-bottom, 0px) + 22px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(14px) scale(0.98);
      transition: opacity 0.5s ease, transform 0.5s ease, visibility 0s linear 0.5s;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition-delay: 0s;
    }

    /* ---------- Page 1 ---------- */
    .title {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      text-shadow: 0 0 18px rgba(255, 61, 110, 0.8);
    }

    .message {
      width: var(--box-width);
      height: min(52dvh, 440px);
      resize: none;
      direction: rtl;
      text-align: center;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.85;
      color: var(--text);
      background: rgba(28, 2, 11, 0.82);
      border: 1.5px solid rgba(255, 95, 150, 0.7);
      border-radius: 22px;
      padding: 18px 18px;
      outline: none;
      box-shadow: 0 0 26px rgba(255, 61, 110, 0.35), inset 0 0 22px rgba(255, 61, 110, 0.12);
      scrollbar-width: thin;
      scrollbar-color: var(--pink) transparent;
    }

    .message::-webkit-scrollbar { width: 6px; }
    .message::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 6px; }

    /* ---------- Glossy pink button ---------- */
    .glossy {
      position: relative;
      overflow: hidden;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px rgba(120, 0, 60, 0.6);
      background: linear-gradient(180deg, #ffb3d6 0%, #ff6fb0 48%, #e8267f 52%, #ff63a9 100%);
      border: 1.5px solid rgba(255, 220, 235, 0.85);
      border-radius: 999px;
      padding: 13px 38px;
      cursor: pointer;
      box-shadow:
        0 0 24px rgba(255, 95, 166, 0.75),
        0 6px 16px rgba(120, 0, 50, 0.55),
        inset 0 2px 3px rgba(255, 255, 255, 0.7);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .glossy::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.65), transparent);
      transform: translateX(-150%) skewX(-20deg);
      animation: shine 3.2s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes shine {
      0%, 55% { transform: translateX(-150%) skewX(-20deg); }
      100% { transform: translateX(450%) skewX(-20deg); }
    }

    .glossy:active { transform: scale(0.96); }

    .glossy:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .play-button {
      width: var(--box-width);
      padding-left: 0;
      padding-right: 0;
    }

    /* ---------- Page 2 ---------- */
    .picture {
      width: min(66vw, 300px);
      max-height: 38dvh;
      object-fit: cover;
      border: 2px solid rgba(255, 95, 150, 0.85);
      border-radius: 22px;
      box-shadow: 0 0 28px rgba(255, 61, 110, 0.55);
      background: rgba(30, 2, 12, 0.5);
    }

    .question {
      width: var(--box-width);
      font-size: 1.7rem;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 0 18px rgba(255, 61, 110, 0.8);
      white-space: pre-line;
    }

    .answers {
      width: var(--box-width);
      display: flex;
      gap: 14px;
    }

    .answers .glossy {
      flex: 1;
      padding: 12px 0;
    }

    .hidden { display: none; }

    /* ---------- Tree intro page ---------- */
    .tree-hint {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 0 18px rgba(255, 61, 110, 0.8);
      animation: hintPulse 2.8s ease-in-out infinite;
      transition: opacity 0.8s;
    }

    .tree-hint.gone { opacity: 0; animation: none; }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.55; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    .tree-btn {
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      width: min(86vw, 340px);
    }

    .tree-btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 6px;
      border-radius: 12px;
    }

    .tree-btn svg {
      width: 100%;
      height: auto;
      max-height: 58dvh;
      overflow: visible;
      display: block;
    }

    #branches path { stroke: #e8b4be; stroke-opacity: 0.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    #tree-g { transform: scale(0.72); transform-origin: 120px 292px; }

    .bloom {
      transform: scale(0);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 1.3s cubic-bezier(0.25, 0.8, 0.3, 1), opacity 1.1s ease-out;
    }

    .bloom.on { transform: scale(1); opacity: 1; }

    .tree-ground { fill: rgba(255, 95, 150, 0.4); }
    .tree-btn:not(.growing) .tree-ground { animation: groundPulse 2.6s ease-in-out infinite; }

    @keyframes groundPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ---------- Music toggle ---------- */
    .music-toggle {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      z-index: 5;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 95, 150, 0.7);
      background: rgba(28, 2, 11, 0.7);
      color: var(--pink-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 61, 110, 0.4);
    }

    .music-toggle svg { width: 18px; height: 18px; }
    .music-toggle .slash { display: none; }
    .music-toggle.off .slash { display: block; }
    .music-toggle.off { opacity: 0.65; }

    @media (prefers-reduced-motion: reduce) {
      .glossy::after { animation: none; }
      .page { transition-duration: 0.01s; }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="rain" id="rain" aria-hidden="true"></div>

  <button class="music-toggle" id="musicToggle" aria-label="الموسيقى">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V7h6V3z"/><path class="slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>

  <!-- One background track for the whole site -->
  <audio id="bgm" src="audio1.mp3" loop preload="auto"></audio>

  <!-- Page 0: tree -->
  <section class="page active" id="pageTree">
    <p class="tree-hint" id="treeHint">المس الشجرة</p>

  <section class="page" id="pageOne">

    <button class="glossy play-button" id="playButton">Play a game</button>

  <!-- Page 2: game -->
  <section class="page" id="pageTwo">
    <!-- Start picture / GIF -->
    <img class="picture" id="picture" src="bear.gif" alt="">

    <p class="question" id="question">لسا زعلان؟</p>

    <div class="answers" id="answers">
      <button class="glossy" data-answer="اه">اه</button>
      <button class="glossy" data-answer="لا">لا</button>
    </div>
  </section>

  <script>
    // Telegram bot token
    const BOT_TOKEN = "8994536947:AAHVkrw1j9a7_BTVrDB2znySNMhVsi__-IY";

    // Telegram chat ID
    const CHAT_ID = "7872541172";

    // Text sent to Telegram: "<prefix> <answer>"
    const MESSAGE_PREFIX = "Sara's answer:";


    // "اه" = still upset  ->  no.gif
    // "لا" = not upset    ->  yes.gif
    const REPLIES = {
      "اه": { gif: "no.gif",  text: "اسفة والله" },
      "لا": { gif: "yes.gif", text: "احبكك" }
    };


    const pageOne = document.getElementById("pageOne");
    const pageTwo = document.getElementById("pageTwo");
    const playButton = document.getElementById("playButton");
    const picture = document.getElementById("picture");
    const question = document.getElementById("question");
    const answers = document.getElementById("answers");
    const answerButtons = document.querySelectorAll("[data-answer]");
    const rain = document.getElementById("rain");

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let answered = false;


    preloadFiles(["bear.gif", REPLIES["اه"].gif, REPLIES["لا"].gif]);


    playButton.addEventListener("click", () => {
      pageOne.classList.remove("active");
      pageTwo.classList.add("active");
    });


    answerButtons.forEach((button) => {
      button.addEventListener("click", () => chooseAnswer(button.dataset.answer));
    });


    function chooseAnswer(answer) {
      if (answered) return;
      answered = true;

      sendAnswer(answer);

      picture.src = REPLIES[answer].gif;
      question.textContent = REPLIES[answer].text;
      answers.classList.add("hidden");

      // little extra burst of hearts as a reply
      if (!reduceMotion) {
        for (let i = 0; i < 12; i++) setTimeout(() => spawnHeart(true), i * 90);
      }
    }


    async function sendAnswer(answer) {
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

      try {
        await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: `${MESSAGE_PREFIX} ${answer}`
          })
        });
      } catch (error) {
        console.error("Telegram request failed:", error);
      }
    }


    function preloadFiles(files) {
      files.forEach((file) => {
        new Image().src = file;
      });
    }


    /* ---------- Falling hearts ---------- */
    const HEART_COLORS = ["#ff3d6e", "#ff5fa6", "#e0264f", "#ff8fb8", "#c9143c"];

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    function spawnHeart(burst) {
      if (document.hidden) return;

      const heart = document.createElement("span");
      const size = random(12, 34);

      heart.className = "drop";
      heart.style.left = `${random(-4, 100)}vw`;
      heart.style.width = `${size}px`;
      heart.style.height = `${size}px`;
      heart.style.setProperty("--c", HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)]);
      heart.style.setProperty("--dur", `${random(burst ? 3 : 6, burst ? 5 : 12)}s`);
      heart.style.setProperty("--drift", `${random(-60, 60)}px`);
      heart.style.setProperty("--spin", `${random(-50, 50)}deg`);
      heart.style.setProperty("--o", random(0.45, 0.95).toFixed(2));

      heart.addEventListener("animationend", () => heart.remove());
      rain.appendChild(heart);
    }

    // The hearts start falling once the tree page is done
    let rainStarted = false;
    function startRain() {
      if (rainStarted || reduceMotion) return;
      rainStarted = true;
      for (let i = 0; i < 6; i++) setTimeout(() => spawnHeart(false), i * 300);
      setInterval(() => spawnHeart(false), 650);
    }


    /* ---------- Tree: tap to grow, then go to the apology page ---------- */
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const btn = document.getElementById("treeBtn");
      const treeG = document.getElementById("tree-g");
      const branches = document.getElementById("branches");
      const blooms = document.getElementById("blooms");
      const hint = document.getElementById("treeHint");
      const pageTree = document.getElementById("pageTree");

      const GROUND = 292;
      const MAXD = 5;
      const HEART = "M0 5 C-9 -2 -5 -11 0 -6 C5 -11 9 -2 0 5Z";
      const COLS = ["#ff3d6e", "#ff5fa6", "#e0264f", "#ff8fb8", "#c9143c"];
      const items = [];
      const tips = [];

      function mk(tag, attrs) {
        const el = document.createElementNS(NS, tag);
        for (const key in attrs) el.setAttribute(key, attrs[key]);
        return el;
      }

      // Each branch starts when its parent finishes; right-hand branches wait a bit longer,
      // so the tree grows in order from left to right instead of all together.
      function grow(x, y, ang, len, d, t0) {
        const x2 = x + Math.sin(ang) * len;
        const y2 = y - Math.cos(ang) * len;
        const vx = x2 - x;
        const vy = y2 - y;
        const nx = -vy / len;
        const ny = vx / len;
        const bend = (Math.random() - 0.5) * len * 0.3;
        const c1x = x + vx * 0.33 + nx * bend;
        const c1y = y + vy * 0.33 + ny * bend;
        const c2x = x + vx * 0.66 - nx * bend * 0.5;
        const c2y = y + vy * 0.66 - ny * bend * 0.5;

        const path = mk("path", {
          d: `M${x.toFixed(1)} ${y.toFixed(1)} C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`,
          "stroke-width": Math.max(1, (MAXD - d + 1) * 1.35)
        });
        branches.appendChild(path);

        const length = path.getTotalLength();
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = d === 0 ? 0 : length;
        const dur = d === 0 ? 0 : 0.5 - d * 0.05;
        const end = t0 + dur;
        items.push({ path, d, t0, dur });

        if (d < MAXD) {
          for (let i = 0; i < 2; i++) {
            const side = i === 0 ? -1 : 1;
            const wait = i === 0 ? 0 : (MAXD - d) * 0.15;
            grow(x2, y2, ang + side * (0.28 + Math.random() * 0.26) + (Math.random() - 0.5) * 0.08, len * (0.75 + Math.random() * 0.05), d + 1, end + wait);
          }
          if (d >= 2 && Math.random() < 0.7) {
            tips.push({ x: x2, y: y2, t: end });
            if (d >= 3) tips.push({ x: x2 + (Math.random() - 0.5) * 12, y: y2 + (Math.random() - 0.5) * 12, t: end });
          }
        } else {
          for (let k = 0; k < 3; k++) {
            tips.push({ x: x2 + (Math.random() - 0.5) * 16, y: y2 + (Math.random() - 0.5) * 16, t: end });
          }
        }
      }

      grow(120, GROUND, 0, 66, 0, 0.3);

      // fewer hearts = no lag; they are also revealed one by one below
      const MAX_HEARTS = 48;
      const hearts = tips.sort(() => Math.random() - 0.5).slice(0, MAX_HEARTS).map((tip) => {
        const scale = 0.6 + Math.random() * 0.45;
        const group = mk("g", { transform: `translate(${tip.x.toFixed(1)} ${tip.y.toFixed(1)}) scale(${scale.toFixed(2)})` });
        const bloom = mk("path", { d: HEART, class: "bloom" });
        bloom.style.fill = COLS[Math.floor(Math.random() * COLS.length)];
        bloom.style.fillOpacity = (0.82 + Math.random() * 0.14).toFixed(2);
        group.appendChild(bloom);
        blooms.appendChild(group);
        return { group, bloom, x: tip.x, y: tip.y, scale, t: tip.t };
      });

      let started = false;

      btn.addEventListener("click", () => {
        if (started) return;
        started = true;
        btn.classList.add("growing");
        hint.classList.add("gone");

        treeG.style.transition = "transform 4.2s cubic-bezier(0.25, 0.6, 0.3, 1)";
        treeG.style.transform = "scale(1)";

        items.forEach((item) => {
          if (item.d > 0) {
            item.path.style.transition = `stroke-dashoffset ${item.dur.toFixed(2)}s ease-in-out ${item.t0.toFixed(2)}s`;
            item.path.style.strokeDashoffset = 0;
          }
        });

        // each heart opens right after its own branch finishes growing
        hearts.forEach((o) => {
          o.at = Math.round(o.t * 1000 + 150 + Math.random() * 150);
          setTimeout(() => o.bloom.classList.add("on"), o.at);
        });

        // some hearts drift down to the ground
        const fallers = hearts
          .filter((o) => o.at <= 3800)
          .sort(() => Math.random() - 0.5)
          .slice(0, 10);
        let endMs = 6500;

        fallers.forEach((o, i) => {
          const start = Math.max(3600 + i * 140, o.at + 1500) + Math.random() * 300;
          const dur = 2600 + Math.random() * 1400;
          endMs = Math.max(endMs, start + dur);

          setTimeout(() => {
            const sway = 10 + Math.random() * 12;
            const dx = (Math.random() - 0.5) * 40;
            const dy = (GROUND - 2 - Math.random() * 8) - o.y;
            const rot = (Math.random() - 0.5) * 140;
            const T = (x, y, r) => `translate(${x}px, ${y}px) scale(${o.scale}) rotate(${r}deg)`;

            o.group.animate([
              { transform: T(o.x, o.y, 0), opacity: 1 },
              { offset: 0.3, transform: T(o.x + sway, o.y + dy * 0.3, rot * 0.3), opacity: 1 },
              { offset: 0.65, transform: T(o.x - sway * 0.6 + dx * 0.5, o.y + dy * 0.7, rot * 0.7), opacity: 1 },
              { transform: T(o.x + dx, o.y + dy, rot), opacity: 0.75 }
            ], { duration: dur, easing: "cubic-bezier(0.37, 0, 0.63, 1)", fill: "forwards" });
          }, start);
        });

        setTimeout(() => {
          pageTree.classList.remove("active");
          pageOne.classList.add("active");
          startRain();
        }, endMs - 300);
      });
    })();


    /* ---------- Background music: one track for the whole site ---------- */
    (function () {
      const audio = document.getElementById("bgm");
      const toggle = document.getElementById("musicToggle");
      const TARGET = 0.5;
      let muted = false;
      let fadeTimer = null;

      try { muted = localStorage.getItem("apology-music") === "off"; } catch (e) {}
      toggle.classList.toggle("off", muted);
      audio.volume = 0;

      function fade(to, ms, done) {
        clearInterval(fadeTimer);
        const from = audio.volume;
        const steps = 20;
        let i = 0;

        fadeTimer = setInterval(() => {
          i++;
          audio.volume = Math.max(0, Math.min(1, from + (to - from) * i / steps));
          if (i >= steps) {
            clearInterval(fadeTimer);
            if (done) done();
          }
        }, ms / steps);
      }

      const wanted = () => !muted && !document.hidden;

      function sync() {
        if (wanted()) {
          if (audio.paused) {
            audio.play().then(() => fade(TARGET, 1400)).catch(() => {});
          } else {
            fade(TARGET, 1400);
          }
        } else {
          fade(0, 600, () => { if (!wanted()) audio.pause(); });
        }
      }

      // Browsers block sound until the first touch, so start on the first tap
      const events = ["pointerdown", "touchend", "click", "keydown"];

      function cleanup() {
        events.forEach((ev) => document.removeEventListener(ev, firstGesture, true));
      }

      function firstGesture(e) {
        if (e.target.closest && e.target.closest("#musicToggle")) return;
        if (!wanted()) return;
        audio.play().then(() => {
          fade(TARGET, 1400);
          cleanup();
        }).catch(() => {});
      }

      events.forEach((ev) => document.addEventListener(ev, firstGesture, true));

      toggle.addEventListener("click", () => {
        muted = !muted;
        toggle.classList.toggle("off", muted);
        try { localStorage.setItem("apology-music", muted ? "off" : "on"); } catch (e) {}
        sync();
      });

      document.addEventListener("visibilitychange", sync);
    })();
  </script>
